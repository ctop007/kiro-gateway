schema: spec-driven

context: |
  仓库有两块：网关（根目录，Python 3.10+ / FastAPI，kiro/ + main.py，测试在 tests/）和桌面端（desktop/，Tauri 2 + Rust 壳，网关作为 sidecar 打包）。
  网关硬规则见根目录 AGENTS.md：代码 / 注释 / 测试名用英文，类型标注 + Google 风格 docstring，不用宽泛 except；每个改动都要有测试，测试完全隔离网络。
  网关功能必须同时覆盖 OpenAI 与 Anthropic 两套接口、流式与非流式两条路径；只做其中一部分时必须写明原因。
  桌面端同时支持 macOS 与 Windows。

rules:
  proposal:
    - 用中文写
  design:
    - 用中文写
    - 涉及网关时写清 OpenAI / Anthropic × 流式 / 非流式 四条路径各自怎么改
    - 大功能（新模块、桌面端新功能、跨网关和桌面端的改动）必须有「事前验尸」一节，其他改动不写这一节：假设上线一个月后这个功能出了事，倒推最可能的 3–6 种出事方式，每种写「怎么出事（什么用户、什么状态、什么操作）→ 后果 → 设计里怎么防 / 测试怎么覆盖」
    - 事前验尸至少从这几类里各想一遍：用户卡在某一步没有出路、提示让用户做一件做不到的事、macOS / Windows / 不同 shell 下行为不同、操作做到一半被取消或杀进程、缓存或配置没同步、断网 / 超时 / 401 / 数据损坏、凭证泄露到日志或界面；想不出就写「已检查，无」，不要硬凑
    - 写了事前验尸时，里面的每条防护都要在 tasks.md 里有对应的实现或测试任务
  specs:
    - 用中文写需求描述，场景里的标识符保持英文
  tasks:
    - 用中文写
    - 每项任务写明对应的测试（测试文件与测试名）；网关任务要覆盖四条路径
