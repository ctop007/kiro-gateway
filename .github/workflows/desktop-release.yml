# 桌面端（desktop/）出包：mac universal dmg + 签名更新包，Windows NSIS 安装器 + 签名。
# 触发：
#   - push tag `desktop-v*`：出包并挂到 GitHub Release（tag 名就是 Release 名）
#   - 手动 workflow_dispatch：只出包、上传 artifact，不建 Release（用来试跑）
# Release 里除了安装包和 .sig，还有 latest.json（应用内升级读它，地址见
# desktop/src-tauri/tauri.conf.json 的 plugins.updater.endpoints）。更新说明取 annotated tag 正文，
# 正文里单独一行 [force-upgrade] 表示强制升级。签名私钥在 Secret TAURI_SIGNING_PRIVATE_KEY。
name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # ── 网关 sidecar（PyInstaller 只能打本机架构）──
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'

      - name: Sidecars (macOS arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # x86_64 版在 Rosetta 下构建和冒烟
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          uv python install --no-bin cpython-3.13-macos-aarch64 cpython-3.13-macos-x86_64
          bash scripts/build-sidecar.sh --arch arm64
          bash scripts/build-sidecar.sh --arch x86_64

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'

      - name: Sidecar (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      # ── App 与更新包（minisign 签名；私钥无密码）──
      - name: Build app (macOS universal)
        if: runner.os == 'macOS'
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: >-
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          --config src-tauri/tauri.updater.conf.json

      - name: Build app (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: >-
          pnpm tauri build --bundles nsis
          --config src-tauri/tauri.updater.conf.json

      # upload-artifact 不吃 working-directory，路径要带 desktop/ 前缀
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 90
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不合并：保持 bundles-macOS/、bundles-Windows/ 两个目录，release_lib 按这个布局找文件
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*

      - run: find artifacts -type f

      # checkout 把 annotated tag 变成指向提交的引用，重新取 tag 对象才读得到正文
      - name: Release notes from the tag
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::${TAG} 不是 annotated tag（用 git tag -a ${TAG} -F notes.md 打）"
            exit 1
          fi
          body="$(git tag -l --format='%(contents:body)' "${TAG}")"
          [ -n "$body" ] || body="$(git tag -l --format='%(contents:subject)' "${TAG}")"
          printf '%s\n' "$body" > tag-body.txt

      # 上一个已发布 Release（不含草稿和预发布）的 latest.json，用来沿用 minRequiredVersion。
      # 一个 Release 都没有（第一次发布）才用默认值 0.0.1；已经发过却取不到清单就让发布失败，
      # 否则会悄悄把强制升级的下限降回 0.0.1。
      - name: Previous latest.json
        run: |
          set -euo pipefail
          count="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q 'length')"
          if [ "$count" = "0" ]; then
            echo "第一次发布：没有上一个 Release，minRequiredVersion 用默认值"
          elif gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --output previous-latest.json --clobber; then
            echo "取到上一个 Release 的 latest.json"
          else
            echo "::error::已经发过 Release，但取不到上一个 latest.json；为避免降低强制升级的下限，本次发布中止。检查上一个 Release 是否带 latest.json。"
            exit 1
          fi

      - name: Build latest.json
        run: |
          set -euo pipefail
          args=(prepare --version "${TAG#desktop-v}"
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            --tag-body tag-body.txt
            --bundle-dir artifacts/bundles-macOS/universal-apple-darwin/release/bundle
            --windows-dir artifacts/bundles-Windows/release/bundle
            --out release-out)
          [ -f previous-latest.json ] && args+=(--previous-manifest previous-latest.json)
          python3 -I desktop/scripts/release_lib.py "${args[@]}"
          python3 -I desktop/scripts/release_lib.py verify-manifest release-out/assets/latest.json
          cat release-out/assets/latest.json

      # 上传的就是 release-out/assets 里的文件（不含空格的名字）+ latest.json
      - uses: softprops/action-gh-release@v2
        with:
          name: Kiro Gateway 桌面端 ${{ github.ref_name }}
          body_path: release-out/notes.md
          files: release-out/assets/*
          fail_on_unmatched_files: true
